name: Build QMK firmware

on:
  push:
    paths: ['firmware/**', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['firmware/**', '.github/workflows/firmware.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install ARM build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libhidapi-hidraw0
          python -m pip install qmk==1.2.0
      - name: Check hardware and VIA definitions
        run: python -m unittest discover -s firmware/tests -v
      - name: Validate VIA with its official parser
        working-directory: firmware/via
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Compile both keymaps and validate UF2 files
        run: python firmware/scripts/build.py --qmk-dir "$RUNNER_TEMP/qmk_firmware" --output-dir artifacts
      - name: Upload firmware and build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MACRO12-RevC-firmware
          path: artifacts/
          if-no-files-found: error
